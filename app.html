.bars{display:flex;gap:8px;align-items:flex-end;min-height:110px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:8px 8px 0 0;min-height:3px}.lock{opacity:.5}

main{max-width:none;margin:0 0 0 210px;padding:32px clamp(24px,4vw,64px) 80px}

.fab{right:36px;bottom:36px}
.ov{align-items:center}.sheet{max-width:520px;border-radius:28px}
.hero{padding:30px}.hero h1{font-size:32px}
}
</style></head>
